name: NetForge Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: reports/pytest-report.xml


  docker-integration:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve benchmark commits
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            CURRENT_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            CURRENT_SHA="${{ github.sha }}"
          fi

          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${CURRENT_SHA}^")"
          fi

          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "CURRENT_SHA=$CURRENT_SHA" >> "$GITHUB_ENV"

          echo "Baseline commit: $BASE_SHA"
          echo "Current commit:  $CURRENT_SHA"

      - name: Prepare benchmark output
        run: mkdir -p "$RUNNER_TEMP/netforge"

      - name: Benchmark baseline
        shell: bash
        run: |
          git checkout --detach "$BASE_SHA"

          docker compose up -d --build
          docker compose ps

          docker compose exec -T client \
            python3 ci_benchmark.py \
            --repetitions 3 \
            --output /tmp/baseline.json

          docker compose cp \
            client:/tmp/baseline.json \
            "$RUNNER_TEMP/netforge/baseline.json"

          docker compose down

      - name: Benchmark current
        shell: bash
        run: |
          git checkout --detach "$CURRENT_SHA"

          docker compose up -d --build
          docker compose ps

          docker compose exec -T client \
            python3 ci_benchmark.py \
            --repetitions 3 \
            --output /tmp/current.json

          docker compose cp \
            client:/tmp/current.json \
            "$RUNNER_TEMP/netforge/current.json"

          docker compose down

      - name: Compare relative performance
        run: |
          python3 ci_regression_check.py \
            "$RUNNER_TEMP/netforge/baseline.json" \
            "$RUNNER_TEMP/netforge/current.json" \
            config/ci_regression_thresholds.json

      - name: Publish performance summary
        if: always()
        shell: bash
        run: |
          if [ -f reports/performance-report.md ]; then
            cat reports/performance-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Performance report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relative-performance-reports
          path: |
            ${{ runner.temp }}/netforge/baseline.json
            ${{ runner.temp }}/netforge/current.json
            reports/performance-report.md

      - name: Stop Docker lab
        if: always()
        run: docker compose down || true
